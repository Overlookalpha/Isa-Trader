<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">     
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IsaTrader - Live Markets</title>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">

</head>

<body>

<div class="dashboard">

<aside class="sidebar">

<h2>🚀 IsaTrader</h2>

<ul>

<li><a href="app.html">🏠 Dashboard</a></li>

<li><a href="livemarkets.html">📈 Live Markets</a></li>

<li><a href="signals.html">🤖 AI Signals</a></li>
<li>📊 Analytics</li>

<li>📜 Trade History</li>

<li>⚙️ Settings</li>

</ul>

</aside>

<main class="content">

<header class="topbar">
    <h1>📈 Live Markets</h1>
</header>

<section class="chart-area">

    <h2>EUR/USD Live Chart</h2>

   <div class="tradingview-widget-container">

  <div id="tradingview_chart"></div>

  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

 <script>

new TradingView.widget({
    "container_id": "tradingview_chart",
    "autosize": true,
    "symbol": "FX:EURUSD",
    "interval": "15",
    "theme": "dark"
});

</script>
</div>

</section>

<section class="cards">

    <div class="card-info">
        <span>EUR/USD</span>
        <h2 id="eurusd">Loading...</h2>
        <small>Live Price</small>
    </div>

    <div class="card-info">
        <span>GBP/USD</span>
        <h2 id="gbpusd">Loading...</h2>
        <small>Live Price</small>
    </div>

    <div class="card-info">
        <span>XAU/USD</span>
        <h2 id="gold">Loading...</h2>
        <small>Gold</small>
    </div>

    <div class="card-info">
        <span>BTC/USD</span>
        <h2 id="btc">Loading...</h2>
        <small>Bitcoin</small>
    </div>

</section>

</main>

</div>

<script type="module" src="../js/livemarkets.js"></script>

</body>

</html>
